services:
  grocy-station:
    build: .
    ports:
      - 8080:3000
    environment:
      - ORIGIN=http://localhost:8080
      - PUBLIC_BROKER_URL=ws://localhost:8082
      - PUBLIC_TOPIC=hid2mqtt
      - GROCY_BASE_URL=http://grocy/api
      - GROCY_API_KEY=dummy
    depends_on:
      grocy:
        condition: service_healthy
      mosquitto:
        condition: service_started

  grocy:
    image: harbor.homelab.sdas.net/library/grocy:master
    ports:
      - 8081:8080
    environment:
      - GROCY_MODE=demo
    tmpfs:
      - /config
    healthcheck:
      test: [
        "CMD-SHELL",
        "curl -fsI -o /dev/null http://localhost:8080/",
      ]
      interval: 10s
      retries: 10
      timeout: 60s

  mosquitto:
    image: eclipse-mosquitto
    entrypoint: /bin/sh -c "printf 'persistence false\nlistener 1883\nprotocol mqtt\nlistener 8082\nprotocol websockets\nallow_anonymous true\n' > /mosquitto/config/mosquitto.conf && exec /docker-entrypoint.sh /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    ports:
      - 1883:1883
      - 8082:8082
    tmpfs:
      - /mosquitto/data
      - /mosquitto/log
