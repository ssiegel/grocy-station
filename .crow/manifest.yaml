when:
  - event: [push, tag]

depends_on:
  - test
  - build

labels:
  os: linux

variables:
  image: harbor.homelab.sdas.net/library/grocy-station
  registry_user: stefan
  registry_env: &registry_env
    REGISTRY_TOKEN:
      from_secret: registry_token
  # Set to '' to skip the mirror step.
  mirror_image: ghcr.io/ssiegel/grocy-station
  mirror_user: ssiegel
  mirror_env: &mirror_env
    MIRROR_TOKEN:
      from_secret: gh_token

  # Native overlay needs no /dev/fuse and no privileges. Setting
  # STORAGE_OPTS to empty discards the default mount_program=fuse-overlayfs
  buildah_env: &buildah_env
    BUILDAH_ISOLATION: chroot
    STORAGE_DRIVER: overlay
    STORAGE_OPTS: ''
  buildah_security_context: &buildah_security_context
    seccompProfile:
      type: Unconfined
    apparmorProfile:
      type: Unconfined
    capabilities:
      add:
        - SETUID
        - SETGID
        - SETFCAP
        # Not needed while the two profiles above are Unconfined. Uncomment if
        # a build fails with "operation not permitted".
        # - CHOWN
        # - DAC_OVERRIDE
        # - FOWNER
        # - FSETID
        # - SYS_CHROOT

steps:
  - name: push manifest
    image: quay.io/buildah/stable:v1.43.5
    environment: *registry_env
    backend_options:
      kubernetes:
        securityContext: *buildah_security_context
    commands:
      - |
        printf '%s' "$${REGISTRY_TOKEN}" |
          buildah login --username ${registry_user} --password-stdin ${image}
      # tags added:
      # - the short commit SHA
      # - the branch or tag ref
      # - "latest" on the default branch
      - |
        tags="sha-$(printf '%s' "$${CI_COMMIT_SHA}" | cut -c1-7)"
        if [ -n "$${CI_COMMIT_TAG}" ]; then
          tags="$${tags} $(printf '%s' "$${CI_COMMIT_TAG}" | tr '/' '-')"
        elif [ -n "$${CI_COMMIT_BRANCH}" ]; then
          tags="$${tags} $(printf '%s' "$${CI_COMMIT_BRANCH}" | tr '/' '-')"
        fi
        if [ "$${CI_COMMIT_BRANCH}" = "$${CI_REPO_DEFAULT_BRANCH}" ]; then
          tags="$${tags} latest"
        fi
        printf '%s\n' "$${tags}" > .release-tags

        buildah manifest create release
        for arch in amd64 arm64; do
          buildah manifest add release "docker://${image}/cache:stage-$${CI_COMMIT_SHA}-$${arch}"
        done

        for tag in $${tags}; do
          echo "pushing ${image}:$${tag}"
          buildah manifest push --all release "docker://${image}:$${tag}"
        done

  # Copies what was just published instead of pushing the local manifest
  # again, so the mirror gets the same digests as the primary registry.
  - name: mirror
    image: quay.io/skopeo/stable:v1.25.1
    when:
      - evaluate: 'mirror_image != ""'
    environment:
      <<: [*registry_env, *mirror_env]
    commands:
      - |
        printf '%s' "$${REGISTRY_TOKEN}" |
          skopeo login --username ${registry_user} --password-stdin ${image}
        printf '%s' "$${MIRROR_TOKEN}" |
          skopeo login --username ${mirror_user} --password-stdin ${mirror_image}
      - |
        for tag in $$(cat .release-tags); do
          echo "copying ${image}:$${tag} to ${mirror_image}:$${tag}"
          skopeo copy --all --preserve-digests \
            "docker://${image}:$${tag}" "docker://${mirror_image}:$${tag}"
        done
