when:
  - event: [push, tag]

# The checks live in the Dockerfile's "test" stage, so this workflow needs no
# knowledge of the toolchain. The code under test is architecture-independent,
# so it runs on the amd64 agent only.
labels:
  platform: linux/amd64

variables:
  # Native overlay needs no /dev/fuse and no privileges. Setting
  # STORAGE_OPTS to empty discards the default mount_program=fuse-overlayfs
  - &buildah_env
    BUILDAH_ISOLATION: chroot
    STORAGE_DRIVER: vfs
    # STORAGE_DRIVER: overlay
    # STORAGE_OPTS: ''
  # Each entry lifts a default that stops buildah outright: seccomp
  # RuntimeDefault blocks unshare(CLONE_NEWUSER), the node's AppArmor profile
  # denies the bind mount over the storage graph root, and the restricted
  # profile drops every capability. Note apparmorProfile is Crow's own
  # spelling, not Kubernetes' appArmorProfile.
  - &buildah_security_context
    seccompProfile:
      type: Unconfined
    apparmorProfile:
      type: Unconfined
    capabilities:
      add:
        - SETUID
        - SETGID
        - SETFCAP
        # Not needed while the two profiles above are Unconfined. Uncomment if
        # a build fails with "operation not permitted".
        # - CHOWN
        # - DAC_OVERRIDE
        # - FOWNER
        # - FSETID
        # - SYS_CHROOT

steps:
  - name: check and test
    image: quay.io/buildah/stable:v1.43.5
    environment:
      <<: *buildah_env
      REGISTRY_TOKEN:
        from_secret: registry_token
    backend_options:
      kubernetes:
        securityContext: *buildah_security_context
    commands:
      - |
        printf '%s' "$${REGISTRY_TOKEN}" |
          buildah login --username stefan --password-stdin harbor.homelab.sdas.net
      - |
        buildah --root /crow/storage build \
          --layers \
          --cache-from harbor.homelab.sdas.net/library/grocy-station-cache \
          --target test \
          --build-arg GIT_HEAD=$${CI_COMMIT_SHA} \
          -f Dockerfile \
          .
