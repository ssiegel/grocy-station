on: [push]

env:
  image: harbor.homelab.sdas.net/library/grocy-station
  registry_user: stefan
  act_base_image: ghcr.io/catthehacker/ubuntu:act-24.04-20260622

jobs:
  # The checks live in the Dockerfile's "test" stage, so this step needs no
  # knowledge of the toolchain and is the same for any project built this
  # way. Runs on one architecture only: the code under test is
  # architecture-independent, so a second run would only cost time.
  test:
    runs-on: [docker, amd64]
    container:
      image: ${{ env.act_base_image }}

    steps:
      - name: Configure Docker Build Cache
        id: cache
        uses: int128/docker-build-cache-config-action@v1.54.0
        with:
          image: ${{ env.image }}
          flavor: prefix=buildcache-amd64-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.image }}
          username: ${{ env.registry_user }}
          password: ${{ secrets.registry_token }}

      # Reads the build cache but does not write it: the build jobs own that,
      # and this stage shares their dependency layer rather than adding to it.
      - name: Check and test
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64
          context: '{{defaultContext}}:.'
          file: ./Dockerfile
          target: test
          build-args: |
            GIT_HEAD=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: ${{ steps.cache.outputs.cache-from }}
          outputs: type=cacheonly

  build-amd64:
    runs-on: [docker, amd64]
    container:
      image: ${{ env.act_base_image }}
      env:
        arch: amd64
    outputs:
      cache: ${{ steps.cache.outputs.cache-from }}
    steps: &build_steps
      - name: Configure Docker Build Cache
        id: cache
        uses: int128/docker-build-cache-config-action@v1.54.0
        with:
          image: ${{ env.image }}
          flavor: prefix=buildcache-${{ env.arch }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.image }}
          username: ${{ env.registry_user }}
          password: ${{ secrets.registry_token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/${{ env.arch }}
          context: '{{defaultContext}}:.'
          file: ./Dockerfile
          build-args: |
            GIT_HEAD=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: ${{ steps.cache.outputs.cache-from }}
          cache-to: ${{ steps.cache.outputs.cache-to }}
          outputs: type=cacheonly

  build-arm64:
    runs-on: [docker, arm64]
    container:
      image: ${{ env.act_base_image }}
      env:
        arch: arm64
    outputs:
      cache: ${{ steps.cache.outputs.cache-from }}
    steps: *build_steps

  # Gated on the tests, so a red commit is never published. The per-arch
  # builds above are deliberately not gated: they only warm the cache, so
  # letting them run alongside the tests costs nothing and keeps the
  # pipeline as short as the slowest of the two.
  build-manifest:
    needs: [test, build-amd64, build-arm64]
    runs-on: docker
    container:
      image: ${{ env.act_base_image }}

    steps:
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.image }}
          username: ${{ env.registry_user }}
          password: ${{ secrets.registry_token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: linux/amd64,linux/arm64
          context: '{{defaultContext}}:.'
          file: ./Dockerfile
          build-args: |
            GIT_HEAD=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: |
            ${{ needs.build-amd64.outputs.cache }}
            ${{ needs.build-arm64.outputs.cache }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
